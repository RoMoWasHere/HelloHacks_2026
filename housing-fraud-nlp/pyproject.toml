[project]
name = "housing-fraud-nlp"
version = "0.1.0"
description = "Rule-based spaCy detectors for rental-listing fraud warning signs"
requires-python = ">=3.10"
dependencies = ["spacy>=3.8,<4", "scikit-learn>=1.4", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
